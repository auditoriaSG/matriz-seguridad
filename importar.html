<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traer información</title><style>body{margin:0;background:#eef4fb;color:#18324b;font-family:Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.card{background:#fff;width:min(520px,calc(100% - 32px));box-sizing:border-box;padding:32px;border-radius:20px;box-shadow:0 16px 45px #173a5c22}h1{color:#1261a0;margin:0 0 10px}p{line-height:1.5}label{display:block;font-weight:700;margin-top:18px}input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:14px;font-size:18px;border:1px solid #aac1d6;border-radius:10px}button{width:100%;margin-top:24px;padding:16px;border:0;border-radius:12px;background:#1261a0;color:#fff;font-size:18px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.message{margin-top:18px;padding:14px;border-radius:10px;background:#eef4fb}.error{background:#ffe8e8;color:#8b1d1d}.success{background:#e5f7ec;color:#176235}</style></head><body><main class="card"><h1>Traer toda mi información</h1><p>Esta acción copiará empleados, departamentos, puestos, sucursales y perfiles desde Supabase hacia esta computadora. No modificará la información en línea.</p><form id="form"><label>Correo de la Matriz<input id="email" type="email" value="auditoria@skinklinik.com.mx" required autocomplete="username"></label><label>Contraseña de la Matriz<input id="password" type="password" required autocomplete="current-password"></label><button id="button">Traer toda mi información</button></form><div id="message" class="message" hidden></div></main><script>const form=document.querySelector('#form'),button=document.querySelector('#button'),message=document.querySelector('#message');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='Copiando información…';message.hidden=false;message.className='message';message.textContent='Espera un momento. No cierres esta página.';try{const response=await fetch('/api/importar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})}),result=await response.json();if(!response.ok)throw new Error(result.error||'No se pudo copiar la información.');localStorage.removeItem('matriz-seguridad-v1-admin-local');message.className='message success';message.innerHTML=`Copia terminada: <strong>${result.counts.empleados} empleados</strong>, ${result.counts.departamentos} departamentos, ${result.counts.puestos} puestos, ${result.counts.sucursales} sucursales y ${result.counts.perfiles} perfiles.<br><br><a href="/">Abrir la página local</a>`;document.querySelector('#password').value=''}catch(error){message.className='message error';message.textContent=error.message}finally{button.disabled=false;button.textContent='Traer toda mi información'}});</script></body></html>
