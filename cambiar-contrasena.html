<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña</title><style>body{margin:0;background:#eef4fb;color:#18324b;font-family:Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.card{background:white;width:min(500px,calc(100% - 32px));box-sizing:border-box;padding:32px;border-radius:20px;box-shadow:0 16px 45px #173a5c22}h1{color:#1261a0;margin-top:0}label{display:block;font-weight:700;margin-top:18px}input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:14px;font-size:18px;border:1px solid #aac1d6;border-radius:10px}button{width:100%;margin-top:24px;padding:16px;border:0;border-radius:12px;background:#1261a0;color:white;font-size:18px;font-weight:700}.message{margin-top:18px;padding:14px;border-radius:10px;background:#eef4fb}.error{background:#ffe8e8;color:#8b1d1d}.success{background:#e5f7ec;color:#176235}</style></head><body><main class="card"><h1>Crear contraseña nueva</h1><p>Escribe una contraseña nueva para entrar a la Matriz de Seguridad.</p><form id="form"><label>Nueva contraseña<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar contraseña<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button id="button">Guardar contraseña nueva</button></form><div id="message" class="message">Comprobando el enlace de recuperación…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=supabase.createClient('https://amlweohcbadjdqscoajp.supabase.co','sb_publishable_EhpzIT3LJVEWkjfG3wQ9Ew_G1og6EiC'),form=document.querySelector('#form'),message=document.querySelector('#message'),button=document.querySelector('#button');
async function prepareSession(){
  const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const accessToken=hash.get('access_token'),refreshToken=hash.get('refresh_token'),tokenHash=query.get('token_hash');
  if(accessToken&&refreshToken)await client.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
  else if(tokenHash)await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
  const {data}=await client.auth.getSession();
  if(data.session){message.textContent='Enlace correcto. Ya puedes crear tu contraseña.';return true}
  message.className='message error';message.textContent='El enlace no pudo iniciar la recuperación. Solicita uno nuevo.';form.hidden=true;return false;
}
let sessionReady=prepareSession();
form.addEventListener('submit',async event=>{event.preventDefault();if(!(await sessionReady))return;const password=document.querySelector('#password').value,confirm=document.querySelector('#confirm').value;if(password!==confirm){message.className='message error';message.textContent='Las dos contraseñas deben ser iguales.';return}button.disabled=true;button.textContent='Guardando…';const {error}=await client.auth.updateUser({password});if(error){message.className='message error';message.textContent='No se pudo cambiar: '+error.message;button.disabled=false;button.textContent='Guardar contraseña nueva';return}message.className='message success';message.innerHTML='Contraseña cambiada correctamente.<br><br>Ya puedes cerrar esta página y volver al asistente.';form.hidden=true});
</script></body></html>
